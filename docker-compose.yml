services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OMNI_CHANNEL_ID=${OMNI_CHANNEL_ID}
      - LIMITE_LOTE=${LIMITE_LOTE:-3}
    volumes:
      - n8n_dados:/home/node/.n8n
      - ./n8n:/home/node/fluxos:ro

  envio-python:
    build: ./python
    env_file: .env
    profiles: ["python"]

volumes:
  n8n_dados:
